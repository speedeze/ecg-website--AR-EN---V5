<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المجموعة الاستشارية المصرية - ECG</title>
  
  <!-- استدعاء خط Cairo العصري -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- ملف التنسيقات العام -->
  <link rel="stylesheet" href="css/style.css">

  <!-- تنسيقات خاصة بصفحة المقدمة (Splash Intro) مع ضبط المساحات بدقة -->
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
      background-color: var(--bg-color);
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    /* حاوية منتصف الصفحة مع مراعاة المسافات المريحة للعين */
    .splash-center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    /* حاوية الحروف مرتبطة من اليسار لليمين (ecg) مع مسافة سفلي متوازنة */
    .company-letters-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
      direction: ltr;
    }

    /* حركة سقوط الحروف بمرونة وانسيابية */
    .company-letter-img {
  height: 75px;
  width: auto;
  object-fit: contain;
  opacity: 0;
  transform: translateY(-40px) scale(0.7);
  /* قم بتغيير 0.8s إلى 1.2s أو أكثر لتبطيء الحركة وجعلها أطول وأكثر نعومة */
  animation: letterEntrance 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
/* زيادة الفارق الزمني بين الحروف لتظهر ببطء وتتابع أطول */
.company-letter-img:nth-child(1) { animation-delay: 0.3s; } /* e */
.company-letter-img:nth-child(2) { animation-delay: 0.7s; } /* c */
.company-letter-img:nth-child(3) { animation-delay: 1.1s; } /* g */
    @keyframes letterEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ظهور النصوص المتحركة أسفل الحروف مع مسافات بين السطور */
    .splash-animated-titles {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateY(20px);
  /* قم بزيادة مدة ظهور النص من 1s إلى 1.5s مثلاً، وزيادة التأخير animation-delay */
  animation: textFadeIn 1.5s ease forwards;
  animation-delay: 1.4s; 
}

    @keyframes textFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .splash-title-main {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--text-main);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .splash-title-sub {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
    }

    /* شريط تحميل جمالي وعصري بمسافة مريحة أسفل النصوص */
    .splash-loader-bar {
      width: 150px;
      height: 4px;
      background-color: var(--border-color);
      border-radius: 4px;
      margin-top: 35px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: modernLoading 1.4s infinite ease-in-out;
    }

    @keyframes modernLoading {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* تذييل الصفحة بمساحات داخلية متوازنة */
    .splash-footer {
      padding: 25px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }
  </style>
</head>
<body id="splashBody">

  <!-- شريط التنقل العلوي الكامل (Sticky Navbar) -->
  <header class="header">
    <div class="container navbar">
      <!-- الشعار واسم الشركة -->
      <a href="index.html" class="brand-logo">
        <img src="images/Ecg_logo.jpeg" alt="شعار المجموعة الاستشارية المصرية" style="height: 50px; width: auto; object-fit: contain; border-radius: 8px;">
        <div class="brand-text">
          <span class="brand-title">المجموعة الاستشارية المصرية</span>
          <span class="brand-subtitle">للمحاسبة والمراجعة والضرائب</span>
        </div>
      </a>


     
    </div>
  </header>

  <!-- منتصف الصفحة: سقوط الحروف والنصوص وشريط التحميل مع مساحات مثالية -->
  <main class="splash-center-content">
    
    <!-- الحروف e c g الساقطة من اليسار لليمين -->
    <div class="company-letters-container">
      <img src="images/letter-e.png" alt="E" class="company-letter-img">
      <img src="images/letter-c.png" alt="C" class="company-letter-img">
      <img src="images/letter-g.png" alt="G" class="company-letter-img">
    </div>

    <!-- النصوص المتحركة -->
    <div class="splash-animated-titles">
      <h1 class="splash-title-main">المجموعة الاستشارية المصرية</h1>
      <div class="splash-title-sub">للمحاسبة والمراجعة والضرائب</div>
    </div>

    <!-- شريط التحميل الجمالي -->
    <div class="splash-loader-bar"></div>

  </main>

  <!-- تذييل الصفحة -->
  <footer class="splash-footer">
    <p>المجموعة الاستشارية المصرية (ECG) &copy; 2026 | جميع الحقوق محفوظة</p>
  </footer>

  <!-- ملف الجافاسكريبت للتحكم بالثيم والتحويل التلقائي لصفحة home.html بعد 3.8 ثانية -->
  <script src="js/main.js"></script>
  <script>
    setTimeout(() => {
      document.getElementById('splashBody').style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 600); // هذا هو وقت تأثير التلاشي (Fade Out) ويقدر بـ 600 ميللي ثانية (0.6 ثانية)
    }, 3800); // <-- قم بتعديل هذا الرقم لزيادة أو تقليل وقت ظهور الصفحة بالكامل
  </script>

</body>
</html>
